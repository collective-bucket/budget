<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ay | Bütçe</title>
  <meta name="description" content="Aylık gelir ve harcamalar." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="" />
        <span>Bütçe</span>
      </a>
      <button class="nav-toggle" type="button" aria-label="Menüyü aç" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-cta">
        <nav class="nav-links">
          <a href="/">Anasayfa</a>
          <a href="/incomes">Gelirler</a>
          <a href="/goals">Hedefler</a>
        </nav>
        <div class="cb-auth-controls" data-cb-auth></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1 id="month-title">Ay</h1>
          <p>Gelirleri işaretle, harcamaları ekle veya düzenle.</p>
        </div>
        <div class="hero-toolbar" id="month-actions" hidden>
          <button id="add-expense" class="btn btn-primary" type="button">Harcama ekle</button>
        </div>
      </section>

      <div id="login-prompt" class="login-action" hidden>
        <a id="login-link" class="btn btn-primary" href="#">Giriş yap</a>
      </div>

      <div id="app-content" hidden>
        <section class="panel">
          <div class="stats">
            <div class="stat"><span>Gelir</span><strong id="stat-income">0 ₺</strong></div>
            <div class="stat"><span>Harcama</span><strong id="stat-expense">0 ₺</strong></div>
            <div class="stat"><span>Kalan</span><strong id="stat-remaining">0 ₺</strong></div>
          </div>
          <p id="daily-wrap" class="meta" hidden></p>
        </section>

        <section class="panel">
          <h2>Gelirler</h2>
          <ul id="income-list" class="list"></ul>
        </section>

        <section class="panel">
          <h2>Harcamalar</h2>
          <ul id="expense-list" class="list"></ul>
        </section>
      </div>

      <p id="page-message" class="message" role="status"></p>
    </div>
  </main>

  <dialog id="expense-dialog" class="modal">
    <form id="expense-form" class="modal-form" method="dialog">
      <div class="modal-header">
        <h2 id="expense-dialog-title">Harcama ekle</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <label for="expense-name">Ad</label>
        <input id="expense-name" type="text" maxlength="80" required placeholder="Market" />
        <label for="expense-amount">Tutar (₺)</label>
        <input id="expense-amount" type="number" min="0.01" step="0.01" required />
        <label for="expense-goal">Hedefe katkı (opsiyonel)</label>
        <select id="expense-goal">
          <option value="">Yok</option>
        </select>
        <p id="expense-message" class="message" role="status"></p>
      </div>
      <div class="modal-actions">
        <button id="expense-delete" class="btn btn-ghost danger" type="button" hidden>Sil</button>
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="expense-submit" class="btn btn-primary" type="submit">Harcama ekle</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="modal">
    <div class="modal-body">
      <div class="modal-header">
        <h2 id="confirm-title">Silinsin mi?</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <p id="confirm-text" class="modal-text"></p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="confirm-delete" class="btn btn-danger-fill" type="button">Sil</button>
      </div>
    </div>
  </dialog>

  <footer>
    <div class="wrap">
      <span>Bütçe</span>
      <a href="https://collectivebucket.com">collectivebucket.com</a>
    </div>
  </footer>

  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/budget.js" defer></script>
  <script src="/assets/ui.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/month.js" defer></script>
</body>
</html>
